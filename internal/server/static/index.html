<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>USB Wiper</title>
  <link rel="preload" as="style" href="/static/css/tokens.css">
  <link rel="preload" as="style" href="/static/css/layout.css">
  <link rel="preload" as="style" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="modulepreload" href="/static/js/api.js">
  <link rel="modulepreload" href="/static/js/state.js">
  <link rel="modulepreload" href="/static/js/util.js">
  <link rel="modulepreload" href="/static/js/components/drawer.js">
  <link rel="modulepreload" href="/static/js/components/toast.js">
  <link rel="modulepreload" href="/static/js/components/hold-confirm.js">
  <link rel="modulepreload" href="/static/js/components/configurator.js">
  <link rel="modulepreload" href="/static/js/components/cert.js">
  <link rel="modulepreload" href="/static/js/views/activity.js">
  <link rel="modulepreload" href="/static/js/views/autowipe.js">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo"><span class="topbar-logo-icon"></span>USB Wiper</span>
        <span class="topbar-status" id="topbar-title">Dashboard</span>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="btn-refresh-all" title="Refresh (r)" aria-label="Refresh data">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <button class="topbar-btn" id="btn-theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-nav">
        <div class="sidebar-group">
          <div class="sidebar-group-label">Operations</div>
          <a class="sidebar-link active" data-route="dashboard" href="#/dashboard">
            <svg class="sidebar-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Dashboard</span>
          </a>
          <a class="sidebar-link" data-route="devices" href="#/devices">
            <svg class="sidebar-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/></svg>
            <span>Devices</span>
          </a>
          <a class="sidebar-link" data-route="queue" href="#/queue">
            <svg class="sidebar-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span>Queue</span>
            <span class="sidebar-badge" id="queue-badge" style="display:none" aria-label="0 jobs">0</span>
          </a>
        </div>

        <div class="sidebar-group">
          <div class="sidebar-group-label">Records</div>
          <a class="sidebar-link" data-route="history" href="#/history">
            <svg class="sidebar-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span>History</span>
          </a>
          <a class="sidebar-link" data-route="activity" href="#/activity">
            <svg class="sidebar-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <span>Activity</span>
          </a>
          <a class="sidebar-link" data-route="autowipe" href="#/autowipe">
            <svg class="sidebar-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
            <span>Auto Wipe</span>
          </a>
        </div>

        <div class="sidebar-group">
          <div class="sidebar-group-label">Config</div>
          <a class="sidebar-link" data-route="presets" href="#/presets">
            <svg class="sidebar-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/></svg>
            <span>Presets</span>
          </a>
          <a class="sidebar-link" data-route="settings" href="#/settings">
            <svg class="sidebar-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            <span>Settings</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main">
      <div class="sse-banner" id="sse-banner" role="status" aria-live="polite"></div>
      <div class="view active" id="view-dashboard"><p class="muted">Loading...</p></div>
      <div class="view" id="view-devices"><p class="muted">Loading...</p></div>
      <div class="view" id="view-queue"><p class="muted">Loading...</p></div>
      <div class="view" id="view-history"><p class="muted">Loading...</p></div>
      <div class="view" id="view-activity"><p class="muted">Loading...</p></div>
      <div class="view" id="view-autowipe"><p class="muted">Loading...</p></div>
      <div class="view" id="view-presets"><p class="muted">Loading...</p></div>
      <div class="view" id="view-settings"><p class="muted">Loading...</p></div>
    </main>

    <!-- Status bar -->
    <div class="statusbar" id="statusbar">
      <span class="statusbar-prefix">Ready</span>
      <span class="statusbar-text" id="statusbar-text" role="status" aria-live="polite">No devices detected</span>
      <button class="statusbar-btn" id="btn-statusbar-toggle" title="Toggle event log" aria-expanded="false" aria-controls="statusbar-detail">
        <span>Log</span>
        <span class="statusbar-badge" id="statusbar-count" style="display:none">0</span>
      </button>
    </div>

    <!-- Status bar detail (expandable event log) -->
    <div class="statusbar-detail" id="statusbar-detail"></div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
