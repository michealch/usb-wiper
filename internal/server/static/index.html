<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USB Wiper</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>USB Wiper</h1>

    <section id="warning">
      <span class="icon">⚠</span> DESTROYS ALL DATA on selected device. Cannot be undone.
    </section>

    <section id="devices" class="card">
      <h2>Devices</h2>
      <div class="card-header-row">
        <button id="refresh" class="btn">Refresh</button>
        <button id="cancel-all" class="btn btn-danger" disabled>Cancel All</button>
      </div>
      <table id="device-table">
        <thead>
          <tr>
            <th>Path</th>
            <th>Model</th>
            <th>Size</th>
            <th>Status</th>
            <th>Progress</th>
            <th>Wipe</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="no-devices" class="muted">No USB devices detected. Insert a USB drive and click Refresh.</p>
    </section>

    <section id="log-section" class="card">
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
