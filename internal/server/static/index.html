<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>USB Wiper</title>
  <link rel="preload" as="style" href="/static/css/tokens.css">
  <link rel="preload" as="style" href="/static/css/layout.css">
  <link rel="preload" as="style" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="modulepreload" href="/static/js/api.js">
  <link rel="modulepreload" href="/static/js/state.js">
  <link rel="modulepreload" href="/static/js/util.js">
  <link rel="modulepreload" href="/static/js/components/toast.js">
  <link rel="modulepreload" href="/static/js/components/overlay.js">
  <link rel="modulepreload" href="/static/js/components/drawer.js">
  <link rel="modulepreload" href="/static/js/components/configurator.js">
  <link rel="modulepreload" href="/static/js/components/hold-confirm.js">
  <link rel="modulepreload" href="/static/js/components/cert.js">
  <link rel="modulepreload" href="/static/js/views/wipe.js">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo"><span class="topbar-logo-icon"></span>USB Wiper</span>
        <span class="topbar-status" id="topbar-title">Wipe</span>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="btn-refresh-all" title="Refresh (r)" aria-label="Refresh data">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <button class="topbar-btn" id="btn-theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-nav">
        <a class="sidebar-link active" data-route="wipe" href="#/wipe">
          <svg class="sidebar-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/></svg>
          <span>Wipe</span>
        </a>
        <a class="sidebar-link" data-route="records" href="#/records">
          <svg class="sidebar-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>Records</span>
        </a>
        <a class="sidebar-link" data-route="settings" href="#/settings">
          <svg class="sidebar-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main" id="main-content">
      <div class="sse-banner" id="sse-banner" role="status" aria-live="polite"></div>
      <div class="view active" id="view-wipe"><p class="muted">Loading...</p></div>
      <div class="view" id="view-records"><p class="muted">Loading...</p></div>
      <div class="view" id="view-settings"><p class="muted">Loading...</p></div>
    </main>

    <!-- Status bar -->
    <div class="statusbar" id="statusbar">
      <span class="statusbar-text" id="statusbar-text" role="status" aria-live="polite">No devices detected</span>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
