name: Auto Tag

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Bump version and tag
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: release')"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Generate changelog and bump version
        id: bump
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --bump --unreleased --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Check if release is needed
        id: check
        run: |
          BUMP_VERSION="${{ steps.bump.outputs.version }}"
          if [ -z "$BUMP_VERSION" ]; then
            echo "No version bump needed (no feat/fix commits since last tag)"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "version=$BUMP_VERSION" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG
        if: steps.check.outputs.skip == 'false'
        run: |
          cat CHANGES.md | cat - CHANGELOG.md > /tmp/new-changelog.md
          mv /tmp/new-changelog.md CHANGELOG.md
          cat CHANGES.md >> $GITHUB_STEP_SUMMARY
          rm CHANGES.md

      - name: Commit and tag
        if: steps.check.outputs.skip == 'false'
        run: |
          TAG="${{ steps.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: release ${TAG}" || true
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin HEAD:main --tags

      - name: Trigger Release workflow
        if: steps.check.outputs.skip == 'false'
        run: |
          TAG="${{ steps.check.outputs.version }}"
          echo "Dispatching Release workflow for tag ${TAG}"
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            --field "tag=${TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
