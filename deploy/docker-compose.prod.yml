services:
  usb-wiper:
    image: usb-wiper:${TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: usb-wiper
    # privileged: true is REQUIRED — without it, USB devices
    # plugged in after container start won't have device nodes.
    # The container needs access to all host /dev entries.
    privileged: true
    volumes:
      - /dev:/dev
      - /sys:/sys:ro
    ports:
      - "${PORT:-8181}:8181"
    environment:
      - PORT=${PORT:-8181}
      - UNSAFE_ALLOW_ALL_USB=${UNSAFE_ALLOW_ALL_USB:-false}
    restart: unless-stopped
