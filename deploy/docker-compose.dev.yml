services:
  usb-wiper-dev:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    container_name: usb-wiper-dev
    privileged: true
    volumes:
      - ..:/src
      - /dev:/dev
      - /sys:/sys:ro
      - go-mod-cache:/go/pkg/mod
    ports:
      - "8181:8181"
    environment:
      - LOG_LEVEL=debug
      - PORT=8181
    restart: unless-stopped

volumes:
  go-mod-cache:
